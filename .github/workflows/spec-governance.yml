name: spec-governance
on: [push, pull_request]
permissions:
  contents: read
jobs:
  canonical-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validation dependencies
        run: python -m pip install -r governance/requirements.txt
      - name: Validate canonical contract offline
        run: python governance/validate_spec.py --json
      - name: Prove drift is rejected
        run: python -m unittest discover -s governance -p 'test_*.py' -v
